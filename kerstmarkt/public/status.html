<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Je bestelling</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">✏️🎄</div>
    <h1 id="shop">Je bestelling</h1>
  </header>

  <div id="content"><p style="text-align:center;color:var(--muted)">Laden…</p></div>

  <div class="live" id="live"><span class="dot"></span><span id="liveText">Live bijgewerkt</span></div>
  <footer class="foot"><a href="/">Nog een badge bestellen</a></footer>
</div>

<script src="/common.js"></script>
<script>
const code = location.pathname.split('/').pop().toUpperCase();
let config, last = null, notified = false;
const $ = (id) => document.getElementById(id);

const STEPS = ['betalen', 'wachtrij', 'printen', 'klaar'];
const STEP_LABEL = ['Betalen', 'In de rij', 'Printen', 'Klaar'];

function stepsHTML(status) {
  // 'opgehaald' telt als alles gedaan
  const idx = status === 'opgehaald' ? 99 : STEPS.indexOf(status);
  return `<div class="steps">${STEP_LABEL.map((l, i) => {
    // stap i is "klaar" als de huidige status voorbij stap i is
    const cls = i < idx ? 'done' : i === idx ? (status === 'klaar' ? 'done now' : 'now') : '';
    return `<div class="${cls}">${l}</div>`;
  }).join('')}</div>`;
}

function stateHTML(o, mp) {
  const next = mp.next;
  const closedNow = mp.phase === 'dicht' || mp.phase === 'na';
  const pickupLater = next ? `${next.label} tussen ${next.open} en ${next.close}` : '';
  const S = {
    betalen:  ['💶', 'Nog even betalen', `Reken ${esc(config.price)} af bij de kraam en noem je code. Daarna gaat je badge de printer in.`],
    wachtrij: ['🧾', 'Betaald, je staat in de rij', 'We gaan zo voor je aan de slag. Loop gerust verder over de markt.'],
    printen:  ['🖨️', 'Je badge wordt geprint', 'Nog even geduld. We laten het hier meteen zien als hij klaar is.'],
    klaar:    ['🎉', 'Klaar! Kom hem ophalen', closedNow && next
                 ? `De kraam is nu dicht. Je badge ligt ${pickupLater} voor je klaar bij ${esc(config.standLocation)}.`
                 : 'Je badge ligt klaar bij de kraam. Laat je code zien en neem hem mee.'],
    opgehaald:['✅', 'Opgehaald, veel plezier!', 'Bedankt voor je bestelling en fijne feestdagen!'],
    geannuleerd: ['✖️', 'Bestelling geannuleerd', 'Klopt dit niet? Loop even langs de kraam.'],
  }[o.status];
  return `<section class="card state ${o.status}">
    <div class="icon">${S[0]}</div><h2>${S[1]}</h2><p>${S[2]}</p>
  </section>`;
}

function noticesHTML(o, mp) {
  const out = [];
  const days = config.days;
  const first = days[0], lastDay = days[days.length - 1];
  const done = ['opgehaald', 'geannuleerd'].includes(o.status);
  if (done) return '';

  if (mp.phase === 'dicht' && mp.next && o.status === 'klaar') {
    // staat al in het statusblok
  } else if (mp.phase === 'dicht' && mp.next) {
    out.push(`<div class="notice sunday"><strong>De kraam is nu dicht.</strong> ${o.status === 'klaar' ? 'Je badge ligt' : 'We maken je badge af en hij ligt'}
      ${esc(mp.next.label)} vanaf ${mp.next.open} klaar bij ${esc(config.standLocation)}.</div>`);
  } else if (mp.phase === 'na') {
    out.push(`<div class="notice sunday">De markt is voorbij. Loop je bestelling mis? Neem dan contact op met de verkoper.</div>`);
  } else if (days.length > 1 && !(mp.phase === 'open' && mp.isLast)) {
    out.push(`<div class="notice"><strong>Geen tijd om te wachten of ben je er ${esc(first.label)} niet meer?</strong>
      Dan kun je hem ook ${esc(lastDay.label)} (${lastDay.open}–${lastDay.close}) ophalen bij ${esc(config.standLocation)}.</div>`);
  } else if (mp.phase === 'open' && mp.isLast) {
    out.push(`<div class="notice">Vandaag is de laatste marktdag: de kraam is open tot ${mp.day.close}.</div>`);
  }
  if (o.status !== 'klaar' && 'Notification' in window && Notification.permission === 'default') {
    out.push(`<div class="notice"><button class="ghost" id="notifyBtn">🔔 Geef me een seintje als hij klaar is</button>
      <div class="hint">Houd deze pagina open, dan trilt je telefoon ook als hij klaar is.</div></div>`);
  }
  return out.length ? `<section class="card">${out.join('')}</section>` : '';
}

function render(o) {
  const mp = marketPhase(config.days);
  const c = colorById(config, o.color);
  $('content').innerHTML = `
    <section class="card code-box">
      ${pencilHTML(o.name, c)}
      <div class="label">Jouw code</div>
      <div class="code">${esc(o.code)}</div>
      <div class="hint">${esc(o.name)} · ${esc(c.label)}</div>
    </section>
    ${stateHTML(o, mp)}
    ${['opgehaald', 'geannuleerd'].includes(o.status) ? '' : `<section class="card">${stepsHTML(o.status)}</section>`}
    ${noticesHTML(o, mp)}`;
  const btn = document.getElementById('notifyBtn');
  if (btn) btn.onclick = () => Notification.requestPermission().then(() => render(o));
  document.title = (o.status === 'klaar' ? '🎉 Klaar! ' : '') + `${o.name} – ${STATUS_LABEL[o.status]}`;
}

function celebrate(o) {
  if (notified) return;
  notified = true;
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch {}
  try {
    if ('Notification' in window && Notification.permission === 'granted')
      new Notification('Je badge is klaar! 🎉', { body: `“${o.name}” ligt klaar bij de kraam.` });
  } catch {}
}

async function poll() {
  try {
    const o = await api('/api/orders/' + code);
    rememberOrder(o.code);
    if (last && last.status !== 'klaar' && o.status === 'klaar') celebrate(o);
    render(o);
    last = o;
    $('live').classList.remove('off'); $('liveText').textContent = 'Live bijgewerkt';
  } catch (e) {
    if (e.status === 404) {
      forgetOrder(code);
      $('content').innerHTML = `<section class="card state"><div class="icon">🔍</div><h2>Niet (meer) gevonden</h2>
        <p>Klopt de code <strong>${esc(code)}</strong>? Opgehaalde bestellingen verdwijnen na een tijdje van deze pagina.</p></section>`;
      $('live').classList.add('hidden');
      return; // stop met pollen
    }
    $('live').classList.add('off'); $('liveText').textContent = 'Geen verbinding, opnieuw proberen…';
  }
  setTimeout(poll, document.hidden ? 15000 : 5000);
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && last) render(last); });

(async () => {
  config = await api('/api/config');
  $('shop').textContent = config.shopName;
  poll();
})();
</script>
</body>
</html>
